<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>マイウォッチ</title>
<style>
:root{
  --ink:#13203a; --ink-soft:#5c6b82; --paper:#eef2f8; --card:#ffffff;
  --line:#d7e0ec; --accent:#1d4b8f; --radius:14px;
  --gain:#16a34a; --loss:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-size:17px;
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;}
header{position:sticky;top:0;z-index:10;background:var(--paper);
  border-bottom:1px solid var(--line);padding:20px 24px 0;}
h1{font-size:28px;margin:0 0 14px;}
.tabs{display:flex;gap:6px;}
.tab{flex:none;padding:12px 24px;border-radius:10px 10px 0 0;
  color:var(--ink-soft);font-size:16px;cursor:pointer;border:1px solid transparent;border-bottom:none;}
.tab.on{background:var(--card);color:var(--ink);font-weight:bold;border-color:var(--line);}
main{max-width:1120px;margin:0 auto;padding:22px 24px 60px;}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.toolbar input[type=search]{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);
  border-radius:10px;font-size:17px;background:var(--card);color:var(--ink);}
.toolbar select{padding:11px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-size:16px;}
.btn{padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:16px;cursor:pointer;white-space:nowrap;}
.btn:active{opacity:.7}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;margin-bottom:8px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-soft);font-size:15px;cursor:pointer;}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.summary{display:flex;gap:12px;overflow-x:auto;margin-bottom:16px;}
.sum-box{flex:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 20px;min-width:140px;}
.sum-box .lbl{font-size:13px;color:var(--ink-soft);}
.sum-box .val{font-size:20px;font-weight:bold;margin-top:4px;}
.empty{text-align:center;color:var(--ink-soft);padding:60px 10px;font-size:16px;}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);}
table.watch-table{width:100%;border-collapse:collapse;font-size:17px;}
table.watch-table th{text-align:left;padding:14px 16px;border-bottom:2px solid var(--line);
  color:var(--ink-soft);font-weight:bold;white-space:nowrap;background:var(--paper);font-size:14px;}
table.watch-table td{padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.watch-table tbody tr:last-child td{border-bottom:none;}
table.watch-table tbody tr:hover{background:rgba(0,0,0,.025);}
table.watch-table tr.row-gain td:first-child{box-shadow:inset 4px 0 0 var(--gain);}
table.watch-table tr.row-loss td:first-child{box-shadow:inset 4px 0 0 var(--loss);}
td.gain{color:var(--gain);font-weight:bold;}
td.loss{color:var(--loss);font-weight:bold;}
.actions-col{white-space:nowrap;}
.icon-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);padding:2px 6px;}
.tag-pill{display:inline-block;font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:2px 10px;color:var(--ink-soft);margin:1px 3px 1px 0;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20;
  align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .18s;}
.overlay.show{display:flex;opacity:1;}
.sheet{position:relative;background:var(--card);border-radius:16px;max-width:560px;width:100%;
  max-height:86vh;overflow-y:auto;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.sheet h2{margin:0 0 16px;font-size:20px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;font-size:16px;background:var(--paper);color:var(--ink);font-family:inherit;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sheet-actions{display:flex;gap:10px;margin-top:18px;}
.sheet-actions .btn{flex:1;text-align:center;}
.col-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.col-item label{flex:1;font-size:15px;}
.col-item .updown{display:flex;gap:4px;}
.col-item button{background:var(--paper);border:1px solid var(--line);border-radius:6px;
  width:28px;height:28px;cursor:pointer;color:var(--ink);}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:15px;
  opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;}
.toast.show{opacity:.92;}
.hint{font-size:13px;color:var(--ink-soft);margin:2px 0 12px;}
.footer-actions{display:flex;gap:10px;justify-content:center;margin:24px 0 6px;}
.footer-actions .btn{font-size:14px;}
.chart-toggle{display:flex;gap:8px;margin-bottom:14px;}
.chart-toggle button{padding:8px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:15px;cursor:pointer;}
.chart-toggle button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.chart-svg-wrap{width:100%;overflow-x:auto;}
.chart-range-label{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:6px;}
.news-list{display:flex;flex-direction:column;}
.news-item{display:block;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);}
.news-item:last-child{border-bottom:none;}
.news-item:hover .news-title{color:var(--accent);}
.news-title{font-size:14px;line-height:1.5;}
.news-pub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
td.news-cell{max-width:280px;overflow:hidden;text-overflow:ellipsis;}
td.news-cell a{color:var(--ink);text-decoration:none;}
td.news-cell a:hover{color:var(--accent);text-decoration:underline;}
</style>
</head>
<body>
<header>
  <h1>マイウォッチ</h1>
  <div class="tabs">
    <div class="tab on" data-tab="watchlist">ウォッチリスト</div>
    <div class="tab" data-tab="holdings" style="display:none">保有</div>
    <div class="tab" data-tab="transactions" style="display:none">取引</div>
  </div>
</header>
<main>
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="銘柄名・コードで検索">
    <select id="sortSelect"></select>
    <button class="btn" id="colBtn">列を編集</button>
    <button class="btn" id="fetchBtn">価格を更新</button>
    <button class="btn primary" id="addBtn">＋追加</button>
  </div>
  <div class="chips" id="tagChips"></div>
  <div class="summary" id="summaryBox"></div>
  <div class="hint">ⓘ 無料の外部プロキシ経由の非公式取得のため、取得できないことがあります(その場合は手動入力欄で上書きしてください)</div>
  <div class="hint" id="fetchHint"></div>
  <div id="listArea"></div>
  <div class="footer-actions">
    <button class="btn" id="exportBtn">JSON書き出し</button>
    <button class="btn" id="importBtn">JSON読み込み</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
</main>

<div class="overlay" id="formOverlay" onclick="if(event.target===this)closeSheet('formOverlay')">
  <div class="sheet" id="formSheet"></div>
</div>
<div class="overlay" id="colOverlay" onclick="if(event.target===this)closeSheet('colOverlay')">
  <div class="sheet" id="colSheet"></div>
</div>
<div class="overlay" id="chartOverlay" onclick="if(event.target===this)closeSheet('chartOverlay')">
  <div class="sheet">
    <h2 id="chartTitle"></h2>
    <div class="chart-toggle">
      <button data-kind="daily" onclick="loadChartRange('daily')">日足</button>
      <button data-kind="weekly" onclick="loadChartRange('weekly')">週足</button>
      <button data-kind="monthly" onclick="loadChartRange('monthly')">月足</button>
    </div>
    <div id="chartArea"></div>
    <h2 style="font-size:16px;margin:22px 0 10px;">最新ニュース</h2>
    <div id="newsArea"></div>
    <div class="sheet-actions"><button class="btn" onclick="closeSheet('chartOverlay')">閉じる</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BUILD_ID = 'kabu-kanri-2026-08-12-12';
(function(){
  try{
    if(sessionStorage.getItem('kabu-build-checked')) return;
    fetch(location.pathname, {cache:'no-store'}).then(r=>r.text()).then(html=>{
      const m = html.match(/BUILD_ID\s*=\s*'([^']+)'/);
      if(m && m[1] !== BUILD_ID){
        sessionStorage.setItem('kabu-build-checked','1');
        location.href = location.pathname + '?v=' + Date.now();
      }
    }).catch(()=>{});
  }catch(e){}
})();

/* ---------- storage ---------- */
const KEYS = {
  watchlist:'kabu-watchlist-v1',
  holdings:'kabu-holdings-v1',
  transactions:'kabu-transactions-v1',
  pricecache:'kabu-pricecache-v1',
  newscache:'kabu-newscache-v1',
};
let storageOK = true;
function loadArr(key){
  try{
    localStorage.setItem('__t__','1'); localStorage.removeItem('__t__');
    const s = localStorage.getItem(key);
    return s ? JSON.parse(s) : [];
  }catch(e){ storageOK=false; return []; }
}
function saveArr(key,val){
  if(!storageOK) return;
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function loadObj(key){
  try{ const s=localStorage.getItem(key); return s?JSON.parse(s):{}; }catch(e){ return {}; }
}
function saveObj(key,val){
  if(!storageOK) return;
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function loadCols(list){
  const key = 'kabu-columns-'+list+'-v1';
  const defs = COLUMN_DEFS[list];
  let saved = null;
  try{
    const s = localStorage.getItem(key);
    if(s) saved = JSON.parse(s);
  }catch(e){}
  if(!saved) return defs.map(c=>({key:c.key, visible:c.defaultVisible}));
  const savedKeys = new Set(saved.map(c=>c.key));
  const merged = saved.filter(c=>defs.some(d=>d.key===c.key));
  defs.forEach(d=>{ if(!savedKeys.has(d.key)) merged.push({key:d.key, visible:d.defaultVisible}); });
  return merged;
}
function saveCols(list,val){
  if(!storageOK) return;
  try{ localStorage.setItem('kabu-columns-'+list+'-v1', JSON.stringify(val)); }catch(e){}
}

/* ---------- column definitions ---------- */
const COLUMN_DEFS = {
  watchlist:[
    {key:'market', label:'市場', defaultVisible:true},
    {key:'ticker', label:'コード', defaultVisible:true},
    {key:'name', label:'銘柄名', defaultVisible:true},
    {key:'price', label:'現在値', defaultVisible:true},
    {key:'changePct', label:'前日比%', defaultVisible:true},
    {key:'targetPrice', label:'目標株価', defaultVisible:true},
    {key:'diffToTarget', label:'目標との差%', defaultVisible:false},
    {key:'news', label:'最新ニュース', defaultVisible:true},
    {key:'tags', label:'タグ', defaultVisible:true},
    {key:'memo', label:'メモ', defaultVisible:false},
    {key:'addedAt', label:'追加日', defaultVisible:false},
  ],
  holdings:[
    {key:'market', label:'市場', defaultVisible:true},
    {key:'ticker', label:'コード', defaultVisible:true},
    {key:'name', label:'銘柄名', defaultVisible:true},
    {key:'qty', label:'数量', defaultVisible:true},
    {key:'avgCost', label:'取得単価', defaultVisible:true},
    {key:'price', label:'現在値', defaultVisible:true},
    {key:'costAmount', label:'取得額', defaultVisible:false},
    {key:'evalAmount', label:'評価額', defaultVisible:true},
    {key:'pl', label:'評価損益', defaultVisible:true},
    {key:'plPct', label:'評価損益%', defaultVisible:true},
    {key:'jpyEvalAmount', label:'評価額(円換算)', defaultVisible:false},
    {key:'tags', label:'タグ', defaultVisible:true},
    {key:'memo', label:'メモ', defaultVisible:false},
  ],
  transactions:[
    {key:'date', label:'日付', defaultVisible:true},
    {key:'market', label:'市場', defaultVisible:true},
    {key:'ticker', label:'コード', defaultVisible:true},
    {key:'name', label:'銘柄名', defaultVisible:true},
    {key:'side', label:'売買', defaultVisible:true},
    {key:'qty', label:'数量', defaultVisible:true},
    {key:'price', label:'単価', defaultVisible:true},
    {key:'fee', label:'手数料', defaultVisible:false},
    {key:'amount', label:'約定代金', defaultVisible:true},
    {key:'costBasisAtSale', label:'売却時取得単価', defaultVisible:false},
    {key:'realizedPL', label:'実現損益', defaultVisible:true},
    {key:'tags', label:'タグ', defaultVisible:true},
    {key:'memo', label:'メモ', defaultVisible:false},
  ],
};

/* ---------- state ---------- */
let state = {
  watchlist: loadArr(KEYS.watchlist),
  holdings: loadArr(KEYS.holdings),
  transactions: loadArr(KEYS.transactions),
  priceCache: loadObj(KEYS.pricecache),
  newsCache: loadObj(KEYS.newscache),
};
let columns = {
  watchlist: loadCols('watchlist'),
  holdings: loadCols('holdings'),
  transactions: loadCols('transactions'),
};
let activeTab = 'watchlist';
let tagFilter = { watchlist:new Set(), holdings:new Set(), transactions:new Set() };
let searchText = '';
let sortKey = { watchlist:'addedAt_desc', holdings:'name_asc', transactions:'date_desc' };

/* ---------- utils ---------- */
function uid(){ return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmtNum(n, decimals){
  if(n===null||n===undefined||isNaN(n)) return '-';
  return Number(n).toLocaleString('ja-JP',{minimumFractionDigits:decimals||0, maximumFractionDigits:decimals||2});
}
function fmtPct(n){
  if(n===null||n===undefined||isNaN(n)) return '-';
  return (n>0?'+':'')+n.toFixed(2)+'%';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function openSheet(id){ document.getElementById(id).classList.add('show'); }
function closeSheet(id){ document.getElementById(id).classList.remove('show'); }
function priceKey(market,ticker){ return market+':'+ticker.toUpperCase(); }
function parseYahooUrl(text){
  if(!text) return null;
  const m = text.match(/finance\.yahoo\.(?:co\.jp|com)\/quote\/([A-Za-z0-9]+)(?:\.([A-Za-z]+))?/i);
  if(!m) return null;
  const symbol = m[1].toUpperCase();
  const suffix = m[2] ? m[2].toUpperCase() : '';
  const market = suffix==='T' ? 'JP' : 'US';
  return {ticker:symbol, market};
}
async function fetchCompanyName(market, ticker){
  const ysym = market==='JP' ? (ticker+'.T') : ticker;
  const target = 'https://finance.yahoo.co.jp/quote/'+encodeURIComponent(ysym);
  const proxied = 'https://corsproxy.io/?url='+encodeURIComponent(target);
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const res = await fetch(proxied, {signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const html = await res.text();
    const m = html.match(/<title>([^<]+)<\/title>/);
    if(!m) throw new Error('no title');
    let name = m[1].split('【')[0].trim();
    name = name.replace(/[\(（]株[\)）]$/,'').trim();
    if(!name) throw new Error('empty name');
    return name;
  }finally{
    clearTimeout(timer);
  }
}

/* ---------- calculations ---------- */
function getPrice(item){
  if(item.manualPrice!==undefined && item.manualPrice!==null && item.manualPrice!=='') return Number(item.manualPrice);
  const c = state.priceCache[priceKey(item.market,item.ticker)];
  return c ? c.price : null;
}
function getFxRate(){
  const c = state.priceCache['FX:JPY=X'];
  return c ? c.price : null;
}
function watchlistMetrics(item){
  const price = getPrice(item);
  const cache = state.priceCache[priceKey(item.market,item.ticker)];
  const changePct = cache ? cache.changePct : null;
  const diffToTarget = (price!=null && item.targetPrice) ? ((price-item.targetPrice)/item.targetPrice*100) : null;
  return {price, changePct, diffToTarget};
}
function holdingMetrics(item){
  const price = getPrice(item);
  const qty = Number(item.qty)||0;
  const avgCost = Number(item.avgCost)||0;
  const costAmount = qty*avgCost;
  const evalAmount = price!=null ? qty*price : null;
  const pl = evalAmount!=null ? evalAmount-costAmount : null;
  const plPct = (pl!=null && costAmount) ? pl/costAmount*100 : null;
  let jpyEvalAmount = evalAmount;
  if(item.market==='US' && evalAmount!=null){
    const fx = getFxRate();
    jpyEvalAmount = fx ? evalAmount*fx : null;
  }
  return {price, costAmount, evalAmount, pl, plPct, jpyEvalAmount};
}
function transactionMetrics(item){
  const qty = Number(item.qty)||0;
  const price = Number(item.price)||0;
  const fee = Number(item.fee)||0;
  const amount = item.side==='buy' ? qty*price+fee : qty*price-fee;
  let realizedPL = null;
  if(item.side==='sell' && item.costBasisAtSale){
    realizedPL = (price - Number(item.costBasisAtSale))*qty - fee;
  }
  return {amount, realizedPL};
}

/* ---------- price fetch ---------- */
async function fetchOneQuote(ysym){
  const target = 'https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(ysym);
  const proxied = 'https://corsproxy.io/?url='+encodeURIComponent(target);
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 10000);
  try{
    const res = await fetch(proxied, {signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const meta = data && data.chart && data.chart.result && data.chart.result[0] && data.chart.result[0].meta;
    if(!meta || meta.regularMarketPrice==null) throw new Error('no price');
    const price = meta.regularMarketPrice;
    const prevClose = meta.chartPreviousClose;
    const changePct = prevClose ? (price-prevClose)/prevClose*100 : null;
    return {price, changePct};
  }finally{
    clearTimeout(timer);
  }
}
async function fetchPrices(){
  const symMap = {};
  [...state.watchlist, ...state.holdings].forEach(it=>{
    if(!it.ticker) return;
    const ysym = it.market==='JP' ? (it.ticker+'.T') : it.ticker;
    symMap[ysym] = {market:it.market, ticker:it.ticker};
  });
  const symbols = Object.keys(symMap);
  if(symbols.length===0){ document.getElementById('fetchHint').textContent=''; return; }
  symbols.push('JPY=X');
  const hint = document.getElementById('fetchHint');
  hint.textContent = '価格を取得中...';
  const now = Date.now();
  const results = await Promise.allSettled(symbols.map(sym=>fetchOneQuote(sym)));
  let okCount=0, failCount=0;
  results.forEach((r,i)=>{
    const sym = symbols[i];
    if(r.status==='fulfilled'){
      okCount++;
      if(sym==='JPY=X'){
        state.priceCache['FX:JPY=X'] = {price:r.value.price, changePct:r.value.changePct, fetchedAt:now};
      }else{
        const info = symMap[sym];
        if(info) state.priceCache[priceKey(info.market,info.ticker)] = {price:r.value.price, changePct:r.value.changePct, fetchedAt:now};
      }
    }else{
      failCount++;
    }
  });
  saveObj(KEYS.pricecache, state.priceCache);
  if(okCount>0){
    hint.textContent = '最終取得: '+new Date(now).toLocaleString('ja-JP')+(failCount?`(${failCount}件取得失敗)`:'');
    toast(failCount ? `一部取得失敗(${okCount}/${symbols.length}件成功)` : '価格を更新しました');
  }else{
    hint.textContent = '取得失敗(前回値を使用中) — 手動入力欄で上書きできます';
    toast('価格取得に失敗しました');
  }
  render();
}

/* ---------- history chart ---------- */
const CHART_RANGES = {
  daily:{range:'1mo', interval:'1d'},
  weekly:{range:'1y', interval:'1wk'},
  monthly:{range:'5y', interval:'1mo'},
};
let chartCurrentItem = null;
async function fetchHistory(market, ticker, range, interval){
  const ysym = market==='JP' ? (ticker+'.T') : ticker;
  const target = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ysym)}?range=${range}&interval=${interval}`;
  const proxied = 'https://corsproxy.io/?url='+encodeURIComponent(target);
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 10000);
  try{
    const res = await fetch(proxied, {signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const result = data && data.chart && data.chart.result && data.chart.result[0];
    if(!result) throw new Error('no data');
    const timestamps = result.timestamp || [];
    const closes = (result.indicators && result.indicators.quote && result.indicators.quote[0] && result.indicators.quote[0].close) || [];
    return timestamps.map((t,i)=>({t, close:closes[i]})).filter(p=>p.close!=null);
  }finally{
    clearTimeout(timer);
  }
}
function openChart(item){
  chartCurrentItem = item;
  document.getElementById('chartTitle').textContent = (item.name||item.ticker) + (item.ticker?' ('+item.ticker+')':'');
  openSheet('chartOverlay');
  loadChartRange('daily');
  loadNews(item);
}
async function fetchNews(market, ticker){
  if(market==='JP'){
    const target = `https://finance.yahoo.co.jp/quote/${encodeURIComponent(ticker)}.T/news`;
    const proxied = 'https://corsproxy.io/?url='+encodeURIComponent(target);
    const res = await fetch(proxied);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const html = await res.text();
    const re = /<a href="(\/news\/detail\/[a-f0-9]+)"[^>]*>\s*<h3[^>]*>([^<]+)</g;
    return [...html.matchAll(re)].slice(0,8).map(m=>({title:m[2], url:'https://finance.yahoo.co.jp'+m[1], publisher:''}));
  }else{
    const target = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(ticker)}&newsCount=8`;
    const proxied = 'https://corsproxy.io/?url='+encodeURIComponent(target);
    const res = await fetch(proxied);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    return (data.news||[]).slice(0,8).map(n=>({title:n.title, url:n.link, publisher:n.publisher||''}));
  }
}
async function fetchAllNews(){
  const targets = state.watchlist.filter(it=>it.ticker);
  if(targets.length===0) return;
  const results = await Promise.allSettled(targets.map(it=>fetchNews(it.market, it.ticker)));
  results.forEach((r,i)=>{
    if(r.status==='fulfilled' && r.value.length>0){
      const it = targets[i];
      state.newsCache[priceKey(it.market,it.ticker)] = {headline:r.value[0].title, url:r.value[0].url, fetchedAt:Date.now()};
    }
  });
  saveObj(KEYS.newscache, state.newsCache);
  render();
}
async function loadNews(item){
  const area = document.getElementById('newsArea');
  area.innerHTML = '<div class="empty">読み込み中...</div>';
  try{
    const items = await fetchNews(item.market, item.ticker);
    if(items.length===0) throw new Error('no news');
    const list = document.createElement('div'); list.className='news-list';
    items.forEach(n=>{
      const a = document.createElement('a');
      a.className='news-item'; a.href=n.url; a.target='_blank'; a.rel='noopener noreferrer';
      a.innerHTML = `<div class="news-title"></div>${n.publisher?`<div class="news-pub"></div>`:''}`;
      a.querySelector('.news-title').textContent = n.title;
      if(n.publisher) a.querySelector('.news-pub').textContent = n.publisher;
      list.appendChild(a);
    });
    area.innerHTML='';
    area.appendChild(list);
  }catch(e){
    area.innerHTML = '<div class="empty">ニュースを取得できませんでした</div>';
  }
}
async function loadChartRange(kind){
  document.querySelectorAll('.chart-toggle button').forEach(b=>b.classList.toggle('on', b.dataset.kind===kind));
  const area = document.getElementById('chartArea');
  area.innerHTML = '<div class="empty">読み込み中...</div>';
  const cfg = CHART_RANGES[kind];
  try{
    const points = await fetchHistory(chartCurrentItem.market, chartCurrentItem.ticker, cfg.range, cfg.interval);
    if(points.length<2) throw new Error('insufficient data');
    area.innerHTML = renderChartSVG(points);
  }catch(e){
    area.innerHTML = '<div class="empty">チャートを取得できませんでした</div>';
  }
}
function renderChartSVG(points){
  const w=700, h=260, pad=20;
  const closes = points.map(p=>p.close);
  const min = Math.min(...closes), max = Math.max(...closes);
  const range = (max-min)||1;
  const stepX = points.length>1 ? (w-pad*2)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = pad + (h-pad*2) * (1 - (p.close-min)/range);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  const trendColor = closes[closes.length-1] >= closes[0] ? 'var(--gain)' : 'var(--loss)';
  const firstDate = new Date(points[0].t*1000).toLocaleDateString('ja-JP');
  const lastDate = new Date(points[points.length-1].t*1000).toLocaleDateString('ja-JP');
  return `<div class="chart-svg-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <polyline points="${coords.join(' ')}" fill="none" stroke="${trendColor}" stroke-width="2.5"/>
  </svg></div>
  <div class="chart-range-label">
    <span>${firstDate} 〜 安値 ${fmtNum(min,2)}</span>
    <span>${lastDate} 〜 高値 ${fmtNum(max,2)}</span>
  </div>`;
}

function allTags(list){
  const set = new Set();
  state[list].forEach(it=>(it.tags||[]).forEach(t=>set.add(t)));
  return [...set].sort();
}

function applySearchSortFilter(list){
  let items = state[list].slice();
  if(searchText){
    const q = searchText.toLowerCase();
    items = items.filter(it=> (it.name||'').toLowerCase().includes(q) || (it.ticker||'').toLowerCase().includes(q));
  }
  if(tagFilter[list].size>0){
    items = items.filter(it=> (it.tags||[]).some(t=>tagFilter[list].has(t)));
  }
  const sk = sortKey[list];
  const metricsFn = list==='watchlist'?watchlistMetrics:list==='holdings'?holdingMetrics:transactionMetrics;
  items.sort((a,b)=>{
    if(sk==='name_asc') return (a.name||'').localeCompare(b.name||'','ja');
    if(sk==='addedAt_desc') return (b.addedAt||'').localeCompare(a.addedAt||'');
    if(sk==='addedAt_asc') return (a.addedAt||'').localeCompare(b.addedAt||'');
    if(sk==='date_desc') return (b.date||'').localeCompare(a.date||'');
    if(sk==='date_asc') return (a.date||'').localeCompare(b.date||'');
    if(sk==='changePct_desc') return (metricsFn(b).changePct||-999)-(metricsFn(a).changePct||-999);
    if(sk==='pl_desc') return (metricsFn(b).pl||-Infinity)-(metricsFn(a).pl||-Infinity);
    if(sk==='pl_asc') return (metricsFn(a).pl||Infinity)-(metricsFn(b).pl||Infinity);
    if(sk==='evalAmount_desc') return (metricsFn(b).evalAmount||-Infinity)-(metricsFn(a).evalAmount||-Infinity);
    return 0;
  });
  return items;
}

function fieldDisplay(list, key, item, metrics){
  switch(key){
    case 'market': return item.market;
    case 'ticker': return item.ticker;
    case 'name': return item.name;
    case 'qty': return fmtNum(item.qty,0);
    case 'avgCost': return fmtNum(item.avgCost,2);
    case 'price': return list==='transactions' ? fmtNum(item.price,2) : (metrics.price!=null ? fmtNum(metrics.price,2)+(item.manualPrice?'(手動)':'') : '未取得');
    case 'changePct': return metrics.changePct!=null ? fmtPct(metrics.changePct) : '-';
    case 'targetPrice': return item.targetPrice ? fmtNum(item.targetPrice,2) : '-';
    case 'diffToTarget': return metrics.diffToTarget!=null ? fmtPct(metrics.diffToTarget) : '-';
    case 'costAmount': return fmtNum(metrics.costAmount,0);
    case 'evalAmount': return metrics.evalAmount!=null ? fmtNum(metrics.evalAmount,0) : '-';
    case 'pl': return metrics.pl!=null ? fmtNum(metrics.pl,0) : '-';
    case 'plPct': return metrics.plPct!=null ? fmtPct(metrics.plPct) : '-';
    case 'jpyEvalAmount': return metrics.jpyEvalAmount!=null ? '¥'+fmtNum(metrics.jpyEvalAmount,0) : '-';
    case 'tags': return (item.tags||[]).join(', ')||'-';
    case 'memo': return item.memo||'-';
    case 'addedAt': return item.addedAt||'-';
    case 'date': return item.date;
    case 'side': return item.side==='buy'?'買い':'売り';
    case 'fee': return fmtNum(item.fee,0);
    case 'amount': return fmtNum(metrics.amount,0);
    case 'costBasisAtSale': return item.costBasisAtSale ? fmtNum(item.costBasisAtSale,2) : '-';
    case 'realizedPL': return metrics.realizedPL!=null ? fmtNum(metrics.realizedPL,0) : '-';
    default: return '';
  }
}
function isGainField(key){ return ['price','changePct','diffToTarget','pl','plPct','realizedPL'].includes(key); }
function gainClass(list, item, metrics, key){
  if(!isGainField(key)) return '';
  let v;
  if(key==='pl'||key==='plPct') v = metrics.pl;
  else if(key==='realizedPL') v = metrics.realizedPL;
  else if(key==='changePct') v = metrics.changePct;
  else if(key==='diffToTarget') v = metrics.diffToTarget;
  else return '';
  if(v==null) return '';
  return v>0?'gain':v<0?'loss':'';
}

function renderSummary(){
  const box = document.getElementById('summaryBox');
  box.innerHTML='';
  if(activeTab!=='holdings'){ box.style.display='none'; return; }
  box.style.display='flex';
  let totalCost=0, totalEval=0, hasEval=false;
  state.holdings.forEach(it=>{
    const m = holdingMetrics(it);
    totalCost += m.costAmount||0;
    if(it.market==='US'){
      if(m.jpyEvalAmount!=null){ totalEval+=m.jpyEvalAmount; hasEval=true; }
    }else if(m.evalAmount!=null){ totalEval+=m.evalAmount; hasEval=true; }
  });
  const totalPL = hasEval ? totalEval-totalCost : null;
  const boxes = [
    ['取得額合計', '¥'+fmtNum(totalCost,0)],
    ['評価額合計', hasEval?'¥'+fmtNum(totalEval,0):'-'],
    ['評価損益合計', totalPL!=null?'¥'+fmtNum(totalPL,0):'-'],
    ['保有銘柄数', state.holdings.length+'件'],
  ];
  boxes.forEach(([lbl,val])=>{
    const d = document.createElement('div'); d.className='sum-box';
    d.innerHTML = `<div class="lbl">${lbl}</div><div class="val">${val}</div>`;
    box.appendChild(d);
  });
}

function openForm(list, item){
  const isEdit = !!item;
  const fields = fieldsForList(list);
  const sheet = document.getElementById('formSheet');
  let html = `<h2>${isEdit?'編集':'追加'} - ${list==='watchlist'?'ウォッチリスト':list==='holdings'?'保有':'取引'}</h2>`;
  fields.forEach(f=>{
    const val = item ? (f.key==='tags' ? (item.tags||[]).join(', ') : (item[f.key]!==undefined?item[f.key]:'')) : '';
    html += `<div class="field"><label>${f.label}</label>`;
    if(f.type==='select'){
      html += `<select data-key="${f.key}">`+f.options.map(([v,l])=>`<option value="${v}" ${val===v?'selected':''}>${l}</option>`).join('')+`</select>`;
    }else if(f.type==='textarea'){
      html += `<textarea data-key="${f.key}" rows="2">${val}</textarea>`;
    }else{
      html += `<input data-key="${f.key}" type="${f.type}" value="${val}">`;
    }
    html += `</div>`;
  });
  html += `<div class="sheet-actions"><button class="btn" id="cancelFormBtn">キャンセル</button><button class="btn primary" id="saveFormBtn">保存</button></div>`;
  sheet.innerHTML = html;
  const tickerInput = sheet.querySelector('[data-key="ticker"]');
  const marketSelect = sheet.querySelector('[data-key="market"]');
  const nameInput = sheet.querySelector('[data-key="name"]');
  async function autoFillName(){
    if(!tickerInput || !nameInput || !marketSelect) return;
    const ticker = tickerInput.value.trim();
    if(!ticker || nameInput.value.trim()) return;
    try{
      const name = await fetchCompanyName(marketSelect.value, ticker);
      if(!nameInput.value.trim()) nameInput.value = name;
    }catch(e){}
  }
  if(tickerInput){
    tickerInput.addEventListener('paste', (e)=>{
      const text = (e.clipboardData || window.clipboardData).getData('text');
      const parsed = parseYahooUrl(text);
      if(parsed){
        e.preventDefault();
        tickerInput.value = parsed.ticker;
        if(marketSelect) marketSelect.value = parsed.market;
        toast('URLから銘柄コードを読み取りました: '+parsed.ticker);
        autoFillName();
      }
    });
    tickerInput.addEventListener('blur', autoFillName);
  }
  sheet.querySelector('#cancelFormBtn').onclick = ()=>closeSheet('formOverlay');
  sheet.querySelector('#saveFormBtn').onclick = ()=>{
    const data = item ? {...item} : {id:uid(), addedAt:new Date().toISOString().slice(0,10)};
    fields.forEach(f=>{
      const el = sheet.querySelector(`[data-key="${f.key}"]`);
      let v = el.value;
      if(f.key==='tags'){ data.tags = v.split(',').map(s=>s.trim()).filter(Boolean); return; }
      if(f.type==='number'){ data[f.key] = v===''?undefined:Number(v); return; }
      data[f.key] = v;
    });
    if(!data.name && !data.ticker){ toast('銘柄名かコードを入力してください'); return; }
    const arr = state[list];
    const idx = arr.findIndex(x=>x.id===data.id);
    if(idx>=0) arr[idx]=data; else arr.push(data);
    saveArr(KEYS[list], arr);
    closeSheet('formOverlay');
    toast('保存しました');
    render();
    if((list==='watchlist' || list==='holdings') && data.ticker){ fetchPrices(); }
    if(list==='watchlist' && data.ticker){ fetchAllNews(); }
  };
  openSheet('formOverlay');
}

function exportJSON(){
  const payload = {watchlist:state.watchlist, holdings:state.holdings, transactions:state.transactions, exportedAt:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kabu-kanri-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(data.watchlist) state.watchlist = data.watchlist;
      if(data.holdings) state.holdings = data.holdings;
      if(data.transactions) state.transactions = data.transactions;
      saveArr(KEYS.watchlist, state.watchlist);
      saveArr(KEYS.holdings, state.holdings);
      saveArr(KEYS.transactions, state.transactions);
      render();
      toast('読み込みました');
    }catch(e){ toast('JSONの読み込みに失敗しました'); }
  };
  reader.readAsText(file);
}

  t.onclick = ()=>{ activeTab = t.dataset.tab; document.getElementById('searchInput').value=''; searchText=''; render(); };
});
document.getElementById('searchInput').oninput = (e)=>{ searchText = e.target.value; render(); };
document.getElementById('sortSelect').onchange = (e)=>{ sortKey[activeTab] = e.target.value; render(); };
document.getElementById('colBtn').onclick = openColumnEditor;
document.getElementById('fetchBtn').onclick = ()=>{ fetchPrices(); fetchAllNews(); };
document.getElementById('addBtn').onclick = ()=>openForm(activeTab, null);
document.getElementById('exportBtn').onclick = exportJSON;
document.getElementById('importBtn').onclick = ()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{ if(e.target.files[0]) importJSON(e.target.files[0]); };

/* ---------- init ---------- */
render();
if(state.watchlist.length || state.holdings.length){ fetchPrices(); fetchAllNews(); }
</script>
</body>
</html>
